[project]
name = "build-an-ai-agent-from-scratch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "cohere>=7.2.0",
    "ddgs>=9.16.0",
    "google-genai>=2.30.1",
    "groq>=1.7.0",
    "litellm>=1.83.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "mistralai>=3.2.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
