[project]
name = "build-an-ai-agent-from-scratch"
version = "0.1.0"
description = "An educational AI agent built on LiteLLM and the Model Context Protocol (MCP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ghassem Bakhtiari", email = "g.bakhtiari296@gmail.com" }]
keywords = ["ai-agent", "litellm", "mcp", "llm", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "ddgs>=9.16.0",
    "jsonschema>=4.26.0",
    # litellm 1.106+ imports mcp.types.CacheableResult, which only exists in the
    # MCP Python SDK v2; this project is pinned to mcp<2. Raise this cap only
    # together with the mcp upgrade, and re-test a real tool-calling run.
    "litellm>=1.105.6,<1.106",
    "mcp[cli]>=1.0.0,<2.0.0",
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Native provider SDKs. The project never imports them directly, so they are
# not installed by default. Add the extra only if your provider needs them:
#   uv sync --extra providers
providers = [
    "anthropic>=1.13.0",
    "cohere>=7.2.0",
    "google-genai>=2.30.1",
    "groq>=1.7.0",
    "mistralai>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# Deliberately conservative: catches real breakage (syntax errors, undefined
# names, broken escapes) without reformatting the whole codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# pytest is optional; the suite is written with unittest and also runs with
# ``python -m unittest discover -s tests``.
testpaths = ["tests"]
