name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --python makes the matrix authoritative. Without it, uv prefers the
      # version pinned in .python-version, so every job could run on 3.13
      # instead of the Python version selected by the matrix.
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev

      - name: Show interpreter
        run: uv run python -c "import sys; print(sys.version)"

      - name: Byte-compile all sources
        run: uv run python -m compileall -q app tools examples tests mcp_agent.py

      - name: Lint for hard errors (undefined names, syntax errors)
        run: uv run ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        env:
          LLM_API_KEY: "test-key"
          XAI_1_API_KEY: "test-key"
          LLM_API_BASE: "https://example.com/v1"
        run: uv run python -m unittest discover -s tests -v
